name: Build Windows installer

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Attach the installer to this existing release tag, e.g. v1.0.0. Leave blank to just build.'
        required: false
        default: ''
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Work out the version
        id: ver
        shell: pwsh
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $v = $env:GITHUB_REF -replace 'refs/tags/v',''
          } elseif ($env:INPUT_RELEASE_TAG) {
            $v = $env:INPUT_RELEASE_TAG -replace '^v',''
          } else {
            $v = '1.0.0'
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Building version $v"

      - name: Check the version in the app matches the tag
        shell: pwsh
        run: |
          $src = Get-Content app/version.py -Raw
          if ($src -notmatch 'APP_VERSION\s*=\s*"([^"]+)"') { throw 'APP_VERSION not found in app/version.py' }
          $appVer = $Matches[1]
          $want = '${{ steps.ver.outputs.version }}'
          Write-Host "app/version.py says $appVer, building $want"
          if ($appVer -ne $want) {
            throw "Version mismatch: app/version.py is $appVer but this build is $want. Update APP_VERSION before tagging."
          }

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.11.1

      - name: Check the sentence splitter
        run: python -m unittest discover -s tests -t . -v

      - name: Build
        run: pyinstaller --noconfirm --clean packaging/lingogeek.spec

      # The two checks below exist because ShortGeek 1.0.0 and 1.0.1 both shipped
      # unable to start. A build check that only looks for files on disk proves
      # nothing about whether the thing runs.
      - name: Run the packaged app and ask it for a page
        shell: pwsh
        run: |
          function Invoke-Check([string]$label, [bool]$noStreams) {
            Write-Host "--- $label ---"
            $env:LINGOGEEK_NO_WINDOW = "1"
            if ($noStreams) { $env:LINGOGEEK_NO_STREAMS = "1" } else { Remove-Item Env:LINGOGEEK_NO_STREAMS -ErrorAction SilentlyContinue }

            # No redirection. Redirecting output hands the app the very streams
            # whose absence is the bug being tested for.
            $p = Start-Process -FilePath "dist\LingoGeek\LingoGeek.exe" -WindowStyle Hidden -PassThru
            try {
              Start-Sleep -Seconds 25

              $out = "$env:LOCALAPPDATA\TechyGeeksHome\LingoGeek\output.txt"
              $err = "$env:LOCALAPPDATA\TechyGeeksHome\LingoGeek\startup-error.txt"
              if (Test-Path $err) {
                Write-Host "startup-error.txt:"; Get-Content $err
                throw "$label - the app failed to start"
              }
              if (-not (Test-Path $out)) { throw "$label - the app never printed its address" }

              $url = (Select-String -Path $out -Pattern 'http://127\.0\.0\.1:\d+/').Matches[0].Value
              Write-Host "address: $url"
              $r = Invoke-WebRequest -Uri "${url}api/health" -UseBasicParsing -TimeoutSec 30
              if ($r.StatusCode -ne 200) { throw "$label - health check returned $($r.StatusCode)" }
              Write-Host "health: $($r.Content)"
              $page = Invoke-WebRequest -Uri $url -UseBasicParsing -TimeoutSec 30
              if ($page.Content -notmatch 'LingoGeek') { throw "$label - the page did not render" }
              Remove-Item $out -ErrorAction SilentlyContinue
              Write-Host "$label : started and served its interface."
            } finally {
              if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
              Start-Sleep -Seconds 2
            }
          }

          Invoke-Check 'with a console' $false
          Invoke-Check 'with no console, as a user gets it' $true

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build the installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DMyAppVersion=${{ steps.ver.outputs.version }} packaging\lingogeek.iss
          $inst = Get-Item packaging\Output\LingoGeekSetup.exe
          Write-Host ("Installer is {0:N1} MB" -f ($inst.Length / 1MB))

      - name: Checksum
        shell: pwsh
        run: |
          $h = (Get-FileHash packaging\Output\LingoGeekSetup.exe -Algorithm SHA256).Hash.ToLower()
          Write-Host "SHA256 $h"

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: LingoGeek-Windows-${{ steps.ver.outputs.version }}
          path: packaging/Output/LingoGeekSetup.exe
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}
          files: packaging/Output/LingoGeekSetup.exe
